[workspace]
resolver = "2"
members = [
    "crates/raft-kv-core",
    "crates/raft-kv-storage",
    "crates/raft-kv-network",
    "crates/raft-kv-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nareswara"]
license = "MIT"
repository = "https://github.com/nareswara353-ux/Project-Rust"
keywords = ["raft", "distributed-systems", "kv-store", "consensus"]
categories = ["database-implementations", "network-programming"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = { version = "1.5", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
crc32fast = "1.3"
clap = { version = "4.4", features = ["derive"] }
async-trait = "0.1"
bincode = "1.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
